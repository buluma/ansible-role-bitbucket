---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  remote_user: root
  tasks:
    - name: Check bitbucket is up
      block:
        - name: Check port
          ansible.builtin.wait_for:
            delay: 10
            port: 7990
            timeout: 600
        - name: Check page
          ansible.builtin.uri:
            return_content: true
            status_code: 200
            timeout: 30
            url: http://localhost:7990
          register: result
          # The port opens before the web application has finished starting,
          # and a start page without the word bitbucket is served until then.
          until: result.content is defined and 'bitbucket' in result.content
          retries: 30
          delay: 10
          when: ansible_facts['os_family'] == 'Debian'
        - name: Check result
          ansible.builtin.fail:
            msg: "'bitbucket' not found in the response body"
          when:
            - ansible_facts['os_family'] == 'Debian'
            - "'bitbucket' not in result.content"
      rescue:
        - name: Diagnostics | systemctl status bitbucket.service
          ansible.builtin.command: systemctl status bitbucket.service --no-pager -l
          changed_when: false
          failed_when: false
          register: _diag_status

        - name: Diagnostics | print systemctl status
          ansible.builtin.debug:
            var: _diag_status.stdout_lines

        - name: Diagnostics | tail launcher.log
          ansible.builtin.shell: tail -n 200 /var/atlassian/application-data/bitbucket/log/launcher.log 2>&1
          changed_when: false
          failed_when: false
          register: _diag_launcher

        - name: Diagnostics | print launcher.log
          ansible.builtin.debug:
            var: _diag_launcher.stdout_lines

        - name: Diagnostics | tail atlassian-bitbucket.log
          ansible.builtin.shell: tail -n 200 /var/atlassian/application-data/bitbucket/log/atlassian-bitbucket.log 2>&1
          changed_when: false
          failed_when: false
          register: _diag_applog

        - name: Diagnostics | print atlassian-bitbucket.log
          ansible.builtin.debug:
            var: _diag_applog.stdout_lines

        - name: Diagnostics | find Mesh log files
          ansible.builtin.find:
            paths: /var/atlassian/application-data/bitbucket
            patterns: '*.log*'
            file_type: file
            recurse: true
          register: _diag_mesh_files
          failed_when: false

        - name: Diagnostics | tail Mesh logs
          ansible.builtin.command:
            argv: "{{ ['tail', '-n', '120', '--'] + (_diag_mesh_files.files | map(attribute='path') | select('search', '(?i)mesh') | list) }}"
          changed_when: false
          failed_when: false
          register: _diag_mesh
          when: _diag_mesh_files.files | map(attribute='path') | select('search', '(?i)mesh') | list | length > 0

        - name: Diagnostics | print Mesh logs
          ansible.builtin.debug:
            var: _diag_mesh.stdout_lines
          when: _diag_mesh.stdout_lines is defined

        - name: Diagnostics | read cgroup memory events
          ansible.builtin.command: cat /sys/fs/cgroup/memory.events
          changed_when: false
          failed_when: false
          register: _diag_memory

        - name: Diagnostics | print cgroup memory events
          ansible.builtin.debug:
            var: _diag_memory.stdout_lines

        - name: Re-raise failure
          ansible.builtin.fail:
            msg: Bitbucket verify failed -- see diagnostics above
