---
- name: debian | Install required package python3-debian
  ansible.builtin.package:
    name: python3-debian
- name: debian | Install required package gnupg
  ansible.builtin.package:
    name: gnupg
# The keys and the one-line sources below were written by earlier versions
# of this role. Remove them so upgrades don't leave duplicate sources. The keys
# are now verified and installed by apt-key.yml.
- name: debian | Remove legacy Apt keys
  ansible.builtin.file:
    path: "{{ item.keyring | regex_replace('\\.gpg$', '.asc') }}"
    state: absent
  loop: "{{ _apt_key }}"
- name: debian | Remove legacy Apt sources
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item.filename }}.list"
    state: absent
  loop: "{{ _apt_repository }}"
- name: debian | Create Apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
# The key of a repository is the entry of _apt_key at the same position. It is
# checked against its listed id before it is installed, see apt-key.yml.
- name: debian | Verify and install Apt keys
  ansible.builtin.include_tasks: apt-key.yml
  loop: "{{ _apt_key | zip(_apt_repository) | list }}"
  loop_control:
    loop_var: _bitbucket_apt_key
    label: "{{ _bitbucket_apt_key[0].url }}"
  when: _bitbucket_apt_key[0].state == 'present'
# item.repo is a one-line "deb [options] URI SUITE [COMPONENT...]" string,
# split here into the parts deb822_repository needs.
# The noqa is there because ansible-lint can't validate the templated types.
- name: debian | Apt-add-repository  # noqa: args[module]
  ansible.builtin.deb822_repository:
    name: "{{ item.filename | regex_replace('[^A-Za-z0-9_-]+', '_') | trim('_') }}"
    mode: "{{ item.mode | default('0644') }}"
    types: "{{ _bitbucket_apt_repository_types }}"
    uris: "{{ _bitbucket_apt_repository_rest[0] }}"
    suites: "{{ _bitbucket_apt_repository_rest[1] }}"
    components: "{{ _bitbucket_apt_repository_rest[2:] | default(omit, true) }}"
    architectures: "{{ _bitbucket_apt_repository_arch | default(omit, true) }}"
    signed_by: "{{ _bitbucket_apt_repository_signed_by }}"
    state: "{{ item.state }}"
  vars:
    _bitbucket_apt_repository_line: "{{ item.repo | trim }}"
    _bitbucket_apt_repository_types: "{{ _bitbucket_apt_repository_line | regex_search('^deb-src|^deb') }}"
    _bitbucket_apt_repository_options: "{{ _bitbucket_apt_repository_line | regex_search('\\[[^\\]]*\\]') | default('', true) }}"
    _bitbucket_apt_repository_arch_option: "{{ _bitbucket_apt_repository_options | regex_search('arch=([^\\s\\]]+)', '\\1') | default([''], true) | first }}"
    _bitbucket_apt_repository_arch: "{{ _bitbucket_apt_repository_arch_option | split(',') | reject('equalto', '') | list }}"
    # Without a signed-by option the key is the one apt-key.yml verified and installed for this repository.
    _bitbucket_apt_repository_signed_by: "{{ _bitbucket_apt_repository_options | regex_search('signed-by=([^\\s\\]]+)', '\\1') | default(['/etc/apt/keyrings/' ~ (item.filename | regex_replace('[^A-Za-z0-9_-]+', '_') | trim('_')) ~ '.asc'], true) | first }}"
    _bitbucket_apt_repository_rest: "{{ _bitbucket_apt_repository_line | regex_replace('^\\S+\\s+(\\[[^\\]]*\\]\\s+)?', '') | split() }}"
  loop: "{{ _apt_repository }}"
  register: result
  until: result is succeeded
# deb822_repository does not refresh the package cache, apt_repository did.
- name: debian | Update apt cache  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when:
    - result is changed
- name: debian | Apt-mark unhold
  ansible.builtin.dpkg_selections:
    name: "{{ item.name | regex_replace('^(.*)=[0-9]*:*[0-9]+\\..*$', '\\1') }}"
    selection: install
  changed_when: false
  failed_when: false
  loop: "{{ _apt }}"
  when: item.state == "present"
- name: debian | Apt-get install
  ansible.builtin.apt:
    name: "{{ item.name }}"
    state: "{{ item.state }}"
  loop: "{{ _apt }}"
  notify:
    - Systemctl restart bitbucket.service
  register: result
  until: result is succeeded
- name: debian | Apt-mark hold
  ansible.builtin.dpkg_selections:
    name: "{{ item.name | regex_replace('^(.*)=[0-9]*:*[0-9]+\\..*$', '\\1') }}"
    selection: hold
  changed_when: false
  failed_when: false
  loop: "{{ _apt }}"
  when: item.state == "present"
