---
# Pins the CI platform/version matrix for this role. Without this, ansible-generator
# falls back to default_platforms and silently discards these choices on regenerate.
platforms:
  - name: EL
    versions:
      - "10"
      - "9"
  - name: Debian
    versions:
      # Excludes 11/12: this atlassian-bitbucket package requires Java 21,
      # unavailable in either release's main repo without backports.
      - "13"
  # Fedora excluded entirely: this atlassian-bitbucket package requires
  # Java 21, which Fedora 43/44 no longer ship (java-21-openjdk was
  # dropped, same as noted in ansible-role-java's history).
  - name: Ubuntu
    versions:
      # Excludes 26.04 (resolute): Bitbucket fails to start there with a
      # "Fatal Error" page, so the role's verify step never gets a 200.
      - noble
      - jammy
